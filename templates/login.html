{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TASKFLOW - Kirish</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        :root {
            --neon-cyan: #00f0ff;
            --neon-blue: #5aa9ff;
            --neon-purple: #c850ff;
            --neon-pink: #ff00aa;
            --dark-bg: #0a0e1a;
            --card-bg: rgba(8, 12, 22, 0.85);
        }

        body {
            background: #0a0e1a;
            background-image: url("{% static 'images/bg.jpg' %}?v=3");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Exo 2', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            cursor: default;
        }

        /* Fondni yorqinroq qilish */
        body::before {
            content: '';
            position: fixed;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                135deg,
                rgba(10, 14, 26, 0.15) 0%,
                rgba(10, 14, 26, 0.25) 100%
            );
            z-index: 1;
            pointer-events: none;
        }

        /* Ko'k tutun izi effekti */
        .smoke-trail {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 2;
            filter: blur(8px);
            background: #5aa9ff;
            box-shadow: 0 0 20px #5aa9ff;
            animation: smokeDisappear 3s ease-out forwards;
        }

        @keyframes smokeDisappear {
            0% {
                opacity: 0.8;
                transform: translate(-50%, -50%) scale(1);
            }
            50% {
                opacity: 0.4;
                transform: translate(-50%, -50%) scale(1.5);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(2);
            }
        }

        /* Kursor nurlanishi */
        .cursor-glow {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(90, 169, 255, 0.3) 0%, rgba(90, 169, 255, 0.15) 40%, transparent 70%);
            pointer-events: none;
            z-index: 2;
            transform: translate(-50%, -50%);
            transition: opacity 0.3s;
            opacity: 0;
            mix-blend-mode: screen;
        }

        /* Harakatdagi zarrachalar */
        .particles {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.6;
            animation: particleFloat 12s infinite ease-in-out;
            box-shadow: 0 0 15px currentColor;
        }

        .particle:nth-child(1) { 
            width: 5px; height: 5px; 
            left: 15%; top: 20%; 
            background: var(--neon-cyan);
            animation-delay: 0s; 
        }
        .particle:nth-child(2) { 
            width: 7px; height: 7px; 
            left: 85%; top: 30%; 
            background: var(--neon-purple);
            animation-delay: 2s; 
        }
        .particle:nth-child(3) { 
            width: 6px; height: 6px; 
            left: 50%; top: 60%; 
            background: var(--neon-pink);
            animation-delay: 4s; 
        }
        .particle:nth-child(4) { 
            width: 8px; height: 8px; 
            left: 25%; top: 75%; 
            background: var(--neon-blue);
            animation-delay: 1s; 
        }
        .particle:nth-child(5) { 
            width: 5px; height: 5px; 
            left: 90%; top: 50%; 
            background: var(--neon-cyan);
            animation-delay: 3s; 
        }
        .particle:nth-child(6) { 
            width: 7px; height: 7px; 
            left: 10%; top: 85%; 
            background: var(--neon-purple);
            animation-delay: 5s; 
        }

        @keyframes particleFloat {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.6; }
            25% { transform: translate(0, -60px) scale(1.3); opacity: 0.8; }
            50% { transform: translate(0, -100px) scale(1); opacity: 0.7; }
            75% { transform: translate(0, -40px) scale(1.2); opacity: 0.75; }
        }

        .login-container {
            position: relative;
            z-index: 3;
            width: 100%;
            max-width: 500px;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            width: 280px;
            padding: 60px 40px;
            background: var(--card-bg);
            border: 2px solid rgba(0, 240, 255, 0.4);
            border-radius: 30px;
            box-shadow: 
                0 0 100px rgba(0, 0, 0, 0.8),
                0 0 120px rgba(0, 240, 255, 0.3),
                inset 0 0 100px rgba(0, 240, 255, 0.08);
            text-align: center;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(30px);
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Ichki naqsh */
        .login-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at 50% 50%, transparent 30%, rgba(0, 240, 255, 0.05) 31%, transparent 32%),
                radial-gradient(circle at 50% 50%, transparent 45%, rgba(200, 80, 255, 0.05) 46%, transparent 47%),
                radial-gradient(circle at 50% 50%, transparent 60%, rgba(255, 0, 170, 0.05) 61%, transparent 62%);
            border-radius: 30px;
            z-index: -1;
            pointer-events: none;
        }

        .login-card:hover,
        .login-card.expanded,
        .login-card:focus-within {
            width: 420px;
            padding: 50px 40px;
            box-shadow: 
                0 0 120px rgba(0, 0, 0, 0.9),
                0 0 150px rgba(0, 240, 255, 0.4),
                inset 0 0 120px rgba(0, 240, 255, 0.1);
        }

        .logo-area {
            margin-bottom: 40px;
            transition: all 0.6s ease;
        }

        .login-card:hover .logo-area,
        .login-card.expanded .logo-area,
        .login-card:focus-within .logo-area {
            margin-bottom: 25px;
        }

        .welcome-text {
            margin-bottom: 15px;
            transition: all 0.6s ease;
        }

        .login-card:hover .welcome-text,
        .login-card.expanded .welcome-text,
        .login-card:focus-within .welcome-text {
            margin-bottom: 35px;
        }

        .welcome-text h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            letter-spacing: 5px;
            text-transform: uppercase;
            filter: drop-shadow(0 0 20px rgba(0, 240, 255, 0.5));
            transition: all 0.6s ease;
        }

        .login-card:hover h2,
        .login-card.expanded h2,
        .login-card:focus-within h2 {
            font-size: 2rem;
            letter-spacing: 3px;
        }

        .welcome-text p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 1rem;
            letter-spacing: 1px;
        }

        .form-content {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .login-card:hover .form-content,
        .login-card.expanded .form-content,
        .login-card:focus-within .form-content {
            max-height: 600px;
            opacity: 1;
        }

        .error-msg {
            background: rgba(255, 50, 80, 0.15);
            border: 1px solid rgba(255, 50, 80, 0.4);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 25px;
            color: #ff6b8a;
            font-size: 0.9rem;
            animation: errorShake 0.5s ease;
        }

        @keyframes errorShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
            transform: translateY(20px);
            opacity: 0;
            transition: all 0.4s ease;
        }

        .login-card:hover .form-group,
        .login-card.expanded .form-group,
        .login-card:focus-within .form-group {
            transform: translateY(0);
            opacity: 1;
        }

        .login-card:hover .form-group:nth-child(2),
        .login-card.expanded .form-group:nth-child(2),
        .login-card:focus-within .form-group:nth-child(2) {
            transition-delay: 0.1s;
        }

        .login-card:hover .form-group:nth-child(3),
        .login-card.expanded .form-group:nth-child(3),
        .login-card:focus-within .form-group:nth-child(3) {
            transition-delay: 0.2s;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: var(--neon-cyan);
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            padding: 15px 20px;
            background: rgba(0, 240, 255, 0.05);
            border: 2px solid rgba(0, 240, 255, 0.25);
            border-radius: 15px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-wrapper input:focus {
            background: rgba(0, 240, 255, 0.1);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.3);
            transform: translateX(5px);
        }

        .input-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .btn-login {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            border: none;
            border-radius: 20px;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.4s ease;
            margin-top: 10px;
            transform: translateY(20px);
            opacity: 0;
            box-shadow: 0 10px 40px rgba(0, 240, 255, 0.3);
        }

        .login-card:hover .btn-login,
        .login-card.expanded .btn-login,
        .login-card:focus-within .btn-login {
            transform: translateY(0);
            opacity: 1;
            transition-delay: 0.3s;
        }

        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 50px rgba(0, 240, 255, 0.5);
        }

        .btn-login:active {
            transform: translateY(-1px);
        }

        .btn-login span {
            position: relative;
            z-index: 1;
        }

        .footer-links {
            margin-top: 30px;
            transform: translateY(20px);
            opacity: 0;
            transition: all 0.4s ease;
        }

        .login-card:hover .footer-links,
        .login-card.expanded .footer-links,
        .login-card:focus-within .footer-links {
            transform: translateY(0);
            opacity: 1;
            transition-delay: 0.4s;
        }

        .footer-links a {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .footer-links a + a {
            display: block;
            margin-top: 0.4rem;
            font-size: 0.8rem;
            opacity: 0.7;
        }

        .footer-links a:hover {
            color: var(--neon-cyan);
            transform: translateX(5px);
        }

        .footer-links a span {
            color: var(--neon-cyan);
            font-weight: 600;
        }

        .input-wrapper.with-toggle input {
            padding-right: 52px;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.45);
            background: rgba(6, 10, 20, 0.6);
            color: #f3fbff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: inset 0 0 12px rgba(0, 240, 255, 0.25), 0 0 12px rgba(0, 240, 255, 0.2);
        }

        .toggle-password:hover {
            background: rgba(6, 10, 20, 0.75);
            transform: translateY(-50%) scale(1.03);
            box-shadow: inset 0 0 14px rgba(0, 240, 255, 0.4), 0 0 16px rgba(0, 240, 255, 0.4);
        }

        .toggle-password:active {
            transform: translateY(-50%) scale(0.97);
        }

        .toggle-password .eye {
            position: relative;
            width: 22px;
            height: 14px;
            border: 2px solid currentColor;
            border-radius: 50% / 60%;
            background: rgba(0, 0, 0, 0.18);
            box-shadow: inset 0 0 6px rgba(255, 255, 255, 0.15);
        }

        .toggle-password .eye::before {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 6px currentColor;
        }

        .toggle-password .eye::after {
            content: '';
            position: absolute;
            width: 28px;
            height: 2px;
            background: currentColor;
            left: -5px;
            top: 50%;
            transform: translateY(-50%) rotate(-32deg);
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .toggle-password.is-hidden .eye::after {
            opacity: 0.9;
        }

        /* Mobil responsiv */
        @media (max-width: 600px) {
            .footer-links a + a {
                font-size: 0.75rem;
            }

            .login-card {
                width: 100%;
                max-width: 320px;
            }

            .login-card:hover,
            .login-card.expanded,
            .login-card:focus-within {
                width: 100%;
                max-width: 420px;
                padding: 40px 30px;
            }

            .login-card h2 {
                font-size: 2.2rem;
            }

            .login-card:hover h2,
            .login-card.expanded h2,
            .login-card:focus-within h2 {
                font-size: 1.8rem;
            }
        }

        /* Touch qurilmalar */
        @media (hover: none) {
            .login-card {
                width: 420px;
                padding: 50px 40px;
            }

            .login-card .form-content {
                max-height: 600px;
                opacity: 1;
            }

            .login-card .form-group,
            .login-card .btn-login,
            .login-card .footer-links {
                transform: translateY(0);
                opacity: 1;
            }

            .login-card .welcome-text p {
                margin-bottom: 35px;
            }
        }
    </style>
</head>
<body>
    <!-- Kursor nurlanishi -->
    <div class="cursor-glow" id="cursorGlow"></div>

    <!-- Harakatdagi zarrachalar -->
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="login-container">
        <div class="login-card" id="loginCard">
            <div class="logo-area"></div>
            
            <div class="welcome-text">
                <h2>KIRISH</h2>
                <p>TASKFLOW tizimiga xush kelibsiz</p>
            </div>

            <div class="form-content">
                {% if xato %}
                <div class="error-msg">
                    <span>Login yoki parol xato! Iltimos, qaytadan tekshiring.</span>
                </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="form-group">
                        <label>Foydalanuvchi</label>
                        <div class="input-wrapper">
                            <input type="text" name="username" placeholder="Username kiriting" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Parol</label>
                        <div class="input-wrapper with-toggle">
                            <input type="password" name="password" placeholder="••••••••" required>
                            <button type="button" class="toggle-password is-hidden" aria-label="Parolni ko'rsatish" aria-pressed="false">
                                <span class="eye"></span>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn-login">
                        <span>Kirish</span>
                    </button>
                </form>

                <div class="footer-links">
                    <a href="{% url 'signup' %}">
                        Hali ro'yxatdan o'tmaganmisiz? <span>Ro'yxatdan o'tish →</span>
                    </a>
                    <a href="{% url 'landing' %}">Bosh sahifaga qaytish</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Kursor nurlanish effekti
        const cursorGlow = document.getElementById('cursorGlow');
        const loginCard = document.getElementById('loginCard');
        let mouseX = 0, mouseY = 0;
        let currentX = 0, currentY = 0;
        let isOverCard = false;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        // Kursor kard ustidami yoki yo'qligini tekshirish
        loginCard.addEventListener('mouseenter', () => {
            isOverCard = true;
        });

        loginCard.addEventListener('mouseleave', () => {
            isOverCard = false;
        });

        // Silliq kursor animatsiyasi
        function animateCursor() {
            currentX += (mouseX - currentX) * 0.1;
            currentY += (mouseY - currentY) * 0.1;
            
            cursorGlow.style.left = currentX + 'px';
            cursorGlow.style.top = currentY + 'px';
            
            requestAnimationFrame(animateCursor);
        }

        animateCursor();

        // Kursor nurini ko'rsatish
        document.addEventListener('mousemove', () => {
            cursorGlow.style.opacity = '1';
        });

        // Ko'k tutun izi effekti - FAQAT KARD TASHQARISIDA
        let lastSmokeTime = 0;

        document.addEventListener('mousemove', (e) => {
            // Faqat kard tashqarisida tutun izi chizish
            if (isOverCard) return;

            const now = Date.now();
            if (now - lastSmokeTime < 30) return;
            lastSmokeTime = now;

            const smoke = document.createElement('div');
            smoke.className = 'smoke-trail';
            
            // Tasodifiy o'lcham (20px dan 40px gacha)
            const size = 20 + Math.random() * 20;
            smoke.style.width = size + 'px';
            smoke.style.height = size + 'px';
            smoke.style.left = e.clientX + 'px';
            smoke.style.top = e.clientY + 'px';
            
            document.body.appendChild(smoke);
            
            // 3 sekunddan keyin o'chirish
            setTimeout(() => {
                smoke.remove();
            }, 3000);
        });

        // Mobil/touch qurilmalarda avtomatik kengaytirish
        if (window.innerWidth <= 768 || ('ontouchstart' in window)) {
            loginCard.classList.add('expanded');
        }

        // Inputlarga magnit effekti
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('mouseenter', function() {
                this.style.transform = 'translateX(5px)';
            });
            
            input.addEventListener('mouseleave', function() {
                if (document.activeElement !== this) {
                    this.style.transform = 'translateX(0)';
                }
            });
        });

        // Parolni ko'rsatish/yashirish
        const toggles = document.querySelectorAll('.toggle-password');
        toggles.forEach(toggle => {
            const wrapper = toggle.closest('.input-wrapper');
            const input = wrapper ? wrapper.querySelector('input') : null;
            if (!input) return;

            const syncState = () => {
                const isHidden = input.type === 'password';
                toggle.classList.toggle('is-hidden', isHidden);
                toggle.setAttribute('aria-pressed', String(!isHidden));
                toggle.setAttribute('aria-label', isHidden ? "Parolni ko'rsatish" : "Parolni yashirish");
            };

            syncState();
            toggle.addEventListener('click', () => {
                input.type = input.type === 'password' ? 'text' : 'password';
                syncState();
                input.focus({ preventScroll: true });
            });
        });

        // Tugma bosishda to'lqin effekti
        const btn = document.querySelector('.btn-login');
        btn.addEventListener('click', function(e) {
            const rect = this.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const ripple = document.createElement('div');
            ripple.style.cssText = `
                position: absolute;
                width: 20px;
                height: 20px;
                background: rgba(255, 255, 255, 0.6);
                border-radius: 50%;
                left: ${x}px;
                top: ${y}px;
                transform: translate(-50%, -50%) scale(0);
                animation: ripple 0.6s ease-out;
                pointer-events: none;
            `;
            
            this.appendChild(ripple);
            
            setTimeout(() => ripple.remove(), 600);
        });

        // To'lqin animatsiyasi
        const style = document.createElement('style');
        style.textContent = `
            @keyframes ripple {
                to {
                    transform: translate(-50%, -50%) scale(20);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
